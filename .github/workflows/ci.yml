name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Test subprocesses can fall back to the system selection instead of DEVELOPER_DIR.
      - name: Select Xcode
        run: sudo xcode-select --switch "$DEVELOPER_DIR"

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun swift --version

      - name: Setup
        run: ./scripts/setup.sh

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts/ci -p '*_tests.py'

      - name: Lint
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Check whitespace
        run: git diff --check

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-logs
          path: .build/logs
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
